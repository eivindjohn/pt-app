<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Training Log</title>
<meta name="description" content="Day-by-day training plan and set log. Data stays on this device.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#161e1a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Training">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-width column; sticky week strip on top, the day's work below, a session opens in place. */
:root {
  --bg: #eef1ed;
  --surface: #ffffff;
  --surface-2: #f6f8f5;
  --ink: #15211b;
  --muted: #5d6b63;
  --line: #d9dfd8;
  --accent: #1d6b48;
  --accent-ink: #ffffff;
  --accent-soft: #dcefe4;
  --good: #2f8a52;
  --warn: #b7791f;
  --bad: #c2412d;
  --good-soft: #e1f2e6;
  --warn-soft: #f8ecd6;
  --bad-soft: #f7e0db;
  --lumin: #6b5fb5;
  --font-display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1411; --surface: #161e1a; --surface-2: #1b2520; --ink: #e5ede8; --muted: #95a59c; --line: #2a3530;
    --accent: #4dbb86; --accent-ink: #0b1510; --accent-soft: #1d3a2c;
    --good: #5cc283; --warn: #e2a84b; --bad: #ec7a65; --good-soft: #1d3527; --warn-soft: #3a2f1b; --bad-soft: #3d221d; --lumin: #a99ef0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1411; --surface: #161e1a; --surface-2: #1b2520; --ink: #e5ede8; --muted: #95a59c; --line: #2a3530;
  --accent: #4dbb86; --accent-ink: #0b1510; --accent-soft: #1d3a2c;
  --good: #5cc283; --warn: #e2a84b; --bad: #ec7a65; --good-soft: #1d3527; --warn-soft: #3a2f1b; --bad-soft: #3d221d; --lumin: #a99ef0;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45; -webkit-text-size-adjust: 100%; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
[hidden] { display: none !important; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top .wrap { padding-block: 10px 8px; display: grid; gap: 8px; }
.bar { display: flex; align-items: center; gap: 8px; }
.brand { white-space: nowrap; font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: .02em; text-transform: uppercase; margin-right: auto; }
.brand span { color: var(--accent); }
.tabs { display: flex; gap: 4px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.tabs button { border: 0; background: none; padding: 4px 12px; border-radius: 999px; font-weight: 600; font-size: 13px; color: var(--muted); }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.save { font-size: 12px; color: var(--muted); min-width: 0; flex: 0 1 auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.grp-name { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 6px 9px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
.save.err { color: var(--bad); }

.week { display: grid; grid-template-columns: 28px repeat(7, 1fr) 28px; gap: 4px; align-items: stretch; }
.week .nav { border: 0; background: none; color: var(--muted); font-size: 18px; border-radius: 8px; }
.day { border: 1px solid transparent; background: none; border-radius: 10px; padding: 4px 0 6px; display: grid; justify-items: center; gap: 2px; min-width: 0; }
.day .dw { font-size: 11px; font-weight: 600; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
.day .dn { font-family: var(--font-display); font-size: 20px; font-weight: 600; line-height: 1; }
.day .dots { display: flex; gap: 3px; height: 6px; }
.dot { width: 6px; height: 6px; border-radius: 50%; border: 1.5px solid var(--muted); }
.dot.done { background: var(--good); border-color: var(--good); }
.dot.skip { border-color: var(--bad); }
.dot.lumin { background: var(--lumin); border-color: var(--lumin); }
.day.today .dn { color: var(--accent); }
.day[aria-current="date"] { background: var(--ink); color: var(--surface); }
.day[aria-current="date"] .dw { color: var(--surface); opacity: .75; }
.day[aria-current="date"] .dn { color: var(--surface); }
.day[aria-current="date"] .dot:not(.done):not(.lumin) { border-color: var(--surface); }

main.wrap { padding-block: 16px 64px; display: grid; gap: 16px; }
h1, h2, h3 { margin: 0; font-family: var(--font-display); text-wrap: balance; }
h1 { font-size: 30px; font-weight: 700; line-height: 1.05; letter-spacing: .01em; }
h2 { font-size: 15px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.sub { color: var(--muted); font-size: 14px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.spacer { margin-left: auto; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 10px; min-width: 0; }
.pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 999px; padding: 1px 8px; font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; border: 1px solid var(--line); color: var(--muted); }
.pill.HIGH { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.pill.MOD { border-color: var(--ink); color: var(--ink); }
.pill.lumin { color: var(--lumin); border-color: var(--lumin); }
.pill.done { background: var(--good-soft); color: var(--good); border-color: transparent; }
.pill.skipped { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 12px; font-weight: 600; font-size: 14px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: none; border-color: transparent; color: var(--muted); }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 4px 9px; font-size: 13px; }
.btn:disabled { opacity: .5; cursor: default; }

/* check-in */
.check h3 { font-size: 18px; }
.scale { display: grid; grid-template-columns: repeat(11, 1fr); gap: 3px; }
.scale button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 6px; padding: 5px 0; font-weight: 600; font-size: 13px; min-width: 0; }
.scale button.z-g[aria-pressed="true"] { background: var(--good); border-color: var(--good); color: #fff; }
.scale button.z-a[aria-pressed="true"] { background: var(--warn); border-color: var(--warn); color: #fff; }
.scale button.z-r[aria-pressed="true"] { background: var(--bad); border-color: var(--bad); color: #fff; }
.test { display: grid; gap: 4px; }
.test label { font-size: 13px; font-weight: 600; }
.test small { color: var(--muted); font-weight: 400; }
.verdict { border-radius: 8px; padding: 8px 10px; font-size: 14px; }
.verdict b { font-family: var(--font-display); letter-spacing: .06em; text-transform: uppercase; margin-right: 6px; }
.verdict.g { background: var(--good-soft); color: var(--good); }
.verdict.a { background: var(--warn-soft); color: var(--warn); }
.verdict.r { background: var(--bad-soft); color: var(--bad); }
.verdict.n { background: var(--surface-2); color: var(--muted); }

/* session list */
.sess { text-align: left; width: 100%; cursor: pointer; }
.sess h3 { font-size: 21px; font-weight: 600; }
.progress { height: 6px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--good); border-radius: 999px; }
.groups { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.empty { text-align: center; color: var(--muted); padding: 28px 14px; border: 1.5px dashed var(--line); border-radius: var(--r); display: grid; gap: 10px; justify-items: center; }

/* session view */
.shead { display: grid; gap: 6px; }
.grp { display: grid; gap: 10px; }
.grp-h { display: flex; align-items: center; gap: 10px; }
.grp-h .tag { font-family: var(--font-display); font-weight: 700; font-size: 15px; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 6px; background: var(--ink); color: var(--surface); }
.grp-h h2 { color: var(--ink); }
.ex { gap: 8px; }
.ex-name { font-weight: 600; font-size: 16px; line-height: 1.25; }
.ex-note { font-size: 13px; color: var(--muted); }
.last { font-size: 12.5px; color: var(--muted); }
.last b { color: var(--ink); font-weight: 600; }
.sets { display: grid; gap: 6px; }
.set { display: grid; align-items: center; gap: 6px; grid-template-columns: 22px minmax(64px, 1fr) repeat(3, minmax(0, 62px)) 40px; }
.set.k-bw { grid-template-columns: 22px minmax(64px, 1fr) repeat(2, minmax(0, 62px)) 40px; }
.set.k-time { grid-template-columns: 22px minmax(64px, 1fr) repeat(2, minmax(0, 62px)) 40px; }
.set.k-run { grid-template-columns: 22px minmax(0, 1fr) 40px; }
.set.k-check { grid-template-columns: minmax(0, 1fr) 40px; }
.set .n { font-family: var(--font-display); font-weight: 600; color: var(--muted); text-align: center; }
.set .plan { font-size: 14px; min-width: 0; }
.set .plan b { font-family: var(--font-display); font-size: 17px; font-weight: 600; }
.set .plan .u { color: var(--muted); font-size: 12px; }
.set .plan div.u { line-height: 1.1; letter-spacing: .04em; }
.set input { width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--surface-2); border-radius: 7px; padding: 6px 6px; text-align: center; font-variant-numeric: tabular-nums; }
.set input.txt { text-align: left; }
.set input::placeholder { color: var(--muted); opacity: .7; }
.tick { width: 40px; height: 34px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface); display: grid; place-items: center; font-size: 16px; color: var(--muted); }
.tick[aria-pressed="true"] { background: var(--good); border-color: var(--good); color: #fff; }
.set.ok .plan { color: var(--muted); }
.colh { display: grid; gap: 6px; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.colh span { text-align: center; }
.runwrap { grid-column: 2 / 3; display: grid; gap: 4px; min-width: 0; }
.exfoot { display: flex; gap: 6px; flex-wrap: wrap; }
.note-in { width: 100%; border: 1px solid var(--line); background: var(--surface-2); border-radius: 7px; padding: 6px 8px; min-height: 36px; resize: vertical; }
.finish { background: var(--surface-2); }
.rpe { display: grid; grid-template-columns: repeat(10, 1fr); gap: 3px; }
.rpe button { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 5px 0; font-weight: 600; min-width: 0; }
.rpe button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.field { display: grid; gap: 4px; font-size: 13px; font-weight: 600; }
.field input, .field select, .field textarea { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 7px 9px; font-weight: 400; min-width: 0; width: 100%; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.edit-set { display: grid; grid-template-columns: 22px repeat(4, minmax(0, 1fr)) 30px; gap: 4px; align-items: center; }
.edit-set input { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 5px; min-width: 0; width: 100%; font-size: 13px; }
.edit-set.wide { grid-template-columns: 22px minmax(0, 1fr) 30px; }
.x { border: 0; background: none; color: var(--muted); font-size: 18px; line-height: 1; }
.banner { border-radius: 8px; padding: 8px 12px; background: var(--warn-soft); color: var(--warn); font-size: 14px; }
.readonly-note { font-size: 13px; color: var(--lumin); }

/* progress */
.chart { width: 100%; height: auto; display: block; }
.chart text { font-family: var(--font-body); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; }
.stat .v { font-family: var(--font-display); font-size: 24px; font-weight: 600; line-height: 1.1; }
.stat .l { font-size: 12px; color: var(--muted); }
.tbl { overflow-x: auto; }
.tbl table { border-collapse: collapse; width: 100%; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.tbl th, .tbl td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl th { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--surface); padding: 8px 14px; border-radius: 8px; font-size: 14px; z-index: 20; max-width: calc(100% - 32px); }

@media (max-width: 420px) {
  h1 { font-size: 26px; }
  .brand { font-size: 18px; }
  .tabs button { padding: 4px 10px; }
  .set { grid-template-columns: 18px minmax(52px, 1fr) repeat(3, minmax(0, 52px)) 36px; gap: 4px; }
  .set.k-bw, .set.k-time { grid-template-columns: 18px minmax(52px, 1fr) repeat(2, minmax(0, 56px)) 36px; }
  .set.k-run { grid-template-columns: 18px minmax(0, 1fr) 36px; }
  .tick { width: 36px; }
  .stat .v { font-size: 20px; }
}
@media (prefers-reduced-motion: no-preference) {
  .progress i { transition: width .3s ease; }
  .tick { transition: background .15s ease, border-color .15s ease; }
}

.data-actions { display: grid; gap: 8px; }
.data-actions .btn { text-align: left; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.data-actions .btn span { color: var(--muted); font-weight: 400; font-size: 13px; }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-variant-numeric: tabular-nums; }
.file-in { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

.ss-wrap { display: grid; gap: 8px; position: relative; padding-left: 14px; }
.ss-wrap::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 4px; border-radius: 4px; background: var(--accent); }
.ss-label { font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.ex-head { display: flex; gap: 8px; align-items: baseline; }
.ex-code { font-family: var(--font-display); font-weight: 700; font-size: 15px; color: var(--muted); min-width: 22px; }
.rest { font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; column-gap: 6px; align-items: baseline; }
.rest b { color: var(--ink); font-variant-numeric: tabular-nums; }
.rest .go { color: var(--accent); font-weight: 600; }
.timer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: var(--ink); color: var(--surface); padding-bottom: env(safe-area-inset-bottom, 0px); }
.timer .wrap { display: flex; align-items: center; gap: 10px; padding-block: 10px; }
.timer .t { font-family: var(--font-display); font-size: 34px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; min-width: 84px; }
.timer .lbl { flex: 1; min-width: 0; font-size: 13px; opacity: .85; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.timer .lbl b { display: block; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; opacity: .7; }
.timer button { border: 1px solid color-mix(in srgb, var(--surface) 35%, transparent); background: none; color: var(--surface); border-radius: 8px; padding: 6px 9px; font-weight: 600; font-size: 13px; }
.timer .bar { height: 3px; background: var(--accent); transform-origin: left; }
.timer.done { background: var(--accent); color: var(--accent-ink); }
.timer.done button { color: var(--accent-ink); border-color: color-mix(in srgb, var(--accent-ink) 35%, transparent); }
body.timing main.wrap { padding-bottom: 120px; }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="bar">
      <div class="brand">Training <span>Log</span></div>
      <div class="tabs" role="group" aria-label="View">
        <button id="tabDay" data-act="tab" data-v="day" aria-pressed="true">Day</button>
        <button id="tabProg" data-act="tab" data-v="progress" aria-pressed="false">Progress</button>
        <button id="tabData" data-act="tab" data-v="data" aria-pressed="false">Data</button>
      </div>
    </div>
    <div class="week" id="week"></div>
  </div>
</header>
<main class="wrap" id="main"><div class="empty">Loading…</div></main>
<div class="toast" id="toast" role="status" hidden></div>
<div class="timer" id="timer" hidden></div>
<script>
(() => {
'use strict';
// ---------- helpers ----------
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const monday = s => { const d = parse(s); const w = (d.getDay() + 6) % 7; d.setDate(d.getDate() - w); return iso(d); };
let TODAY = iso(new Date());
const WD = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
const MO = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const longDate = s => { const d = parse(s); return `${['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][d.getDay()]} ${d.getDate()} ${MO[d.getMonth()]}`; };
const shortDate = s => { const d = parse(s); return `${d.getDate()} ${MO[d.getMonth()]}${d.getFullYear() !== new Date().getFullYear() ? ' ' + String(d.getFullYear()).slice(2) : ''}`; };
const clone = o => JSON.parse(JSON.stringify(o));
const numOrNull = v => { if (v === '' || v == null) return null; const n = Number(String(v).replace(',', '.')); return Number.isFinite(n) ? n : null; };
const fmtKg = n => n == null ? '' : (Math.round(n * 100) / 100).toString();
const repsNum = r => { if (r == null) return null; const m = String(r).match(/\d+(\.\d+)?/); return m ? Number(m[0]) : null; };
const uidGen = () => 'x' + Math.random().toString(36).slice(2, 9);
let toastT;
const toast = msg => { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2800); };
const pref = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
const standalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

// ---------- on-device storage (IndexedDB) ----------
const idb = {
  db: null,
  open() {
    return new Promise((res, rej) => {
      const r = indexedDB.open('training-log', 1);
      r.onupgradeneeded = () => {
        const d = r.result;
        d.createObjectStore('sessions', { keyPath: 'id' });
        d.createObjectStore('checkins', { keyPath: 'date' });
        d.createObjectStore('history', { keyPath: 'id' });
        d.createObjectStore('meta', { keyPath: 'k' });
      };
      r.onsuccess = () => { this.db = r.result; res(); };
      r.onerror = () => rej(r.error);
    });
  },
  all(store) {

  const out = [];

  const path = pts.map((p, i) => `${i ? 'L' : 'M'}${X(p.date).toFixed(1)} ${Y(p.v).toFixed(1)}`).join('');

async function saveFile(name, text, type) {
  const blob = new Blob([text], { type });

    const file = new File([blob], name, { type });
    if (navigator.canShare && navigator.canShare({ files: [file] }) && /iphone|ipad|android/i.test(navigator.userAgent)) { await navigator.share({ files: [file], title: name }); return true; }

  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  return true;
}
async function importPlan(obj) {
  const list = Array.isArray(obj) ? obj : obj && Array.isArray(obj.sessions) ? obj.sessions : null;
  if (!list) throw new Error('That file has no sessions in it.');
  let added = 0, updated = 0, kept = 0, removed = 0; const writes = [], dels = [];
  const ids = new Set(list.map(x => x && x.id).filter(Boolean));
  const rng = obj && obj.replace && obj.replace.from && obj.replace.to ? obj.replace : null;
  if (rng) for (const cur of [...S.sessions.values()]) {
    if (cur.date >= rng.from && cur.date <= rng.to && !ids.has(cur.id) && !hasLogged(cur) && cur.status === 'planned') { S.sessions.delete(cur.id); dels.push(cur.id); removed++; }
  }
  for (const raw of list) {
    if (!raw || !raw.date || !raw.title) continue;
    const id = raw.id || `${raw.date}-${uidGen()}`;
    const cur = S.sessions.get(id);
    if (cur && (hasLogged(cur) || cur.status !== 'planned')) { kept++; continue; }
    const s = { ...clone(raw), id, status: raw.status || 'planned' };
    s.groups = (s.groups || []).filter(g => g && Array.isArray(g.items)).map(g => ({ ...g, items: g.items.filter(i => i && Array.isArray(i.sets)) }));
    S.sessions.set(id, s); writes.push(s); cur ? updated++ : added++;
  }
  await idb.write(['sessions'], os => { dels.forEach(id => os('sessions').delete(id)); writes.forEach(s => os('sessions').put(s)); });
  return `${added} added, ${updated} updated${removed ? `, ${removed} old ones removed` : ''}${kept ? `, ${kept} already logged and left alone` : ''}`;
}

  for (const s of list) for (const g of s.groups || []) for (const it of g.items || []) it.sets.forEach((st, i) => {
    const p = st.plan || {}, d = st.done || {};
    rows.push([s.lumin ? 'Lumin' : 'Log', s.date, s.title, s.phase || '', s.week || '', s.status, g.name, it.name, i + 1, p.r ?? p.t ?? '', p.kg ?? '', p.sec ?? '', d.kg ?? '', d.reps ?? '', d.sec ?? '', d.rpe ?? '', d.ok ? 'yes' : 'no', d.note ?? '', it.comment ?? '', s.sessionRpe ?? '', s.minutes ?? '']);
  });
  const csv = rows.map(r => r.map(c => { const x = String(c); return /[",\n]/.test(x) ? `"${x.replace(/"/g, '""')}"` : x; }).join(',')).join('\n');
  await saveFile(`training-log-${TODAY}.csv`, csv, 'text/csv');
}

// ---------- render ----------
function render() {
  renderWeek();
  for (const [id, v] of [['tabDay', 'day'], ['tabProg', 'progress'], ['tabData', 'data']]) $('#' + id).setAttribute('aria-pressed', S.view === v);
  if (S.view === 'progress') renderProgress();
  else if (S.view === 'data') renderData();
  else if (S.open) renderSession();
  else renderDay();
}
function rerenderKeepScroll() { const y = window.scrollY; render(); window.scrollTo(0, y); }

// ---------- interactions ----------
function ref(k) {
  const [id, gi, ii, si] = k.split('|');
  const s = getSession(id); if (!s || s.readOnly) return {};
  return { id, s, gi: +gi, ii: +ii, si: +si };
}
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const act = b.dataset.act, v = b.dataset.v, k = b.dataset.k;
  if (act === 'tab') { S.view = v; if (v !== 'progress') { S.open = null; S.edit = false; } render(); window.scrollTo(0, 0); return; }
  if (act === 'wk') { S.date = addDays(S.date, +v); S.open = null; S.view = 'day'; render(); return; }
  if (act === 'date') { S.date = v; S.open = null; S.view = 'day'; S.edit = false; render(); return; }
  if (act === 'open') { S.open = v; S.edit = false; render(); window.scrollTo(0, 0); return; }
  if (act === 'back') { S.open = null; S.edit = false; render(); return; }
  if (act === 'toggleEdit') { S.edit = !S.edit; rerenderKeepScroll(); return; }
  if (act === 'note') { NOTES.add(k); rerenderKeepScroll(); const n = document.getElementById('note-' + k); if (n) n.focus(); return; }
  if (act === 'ci') {
    const c = { ...(S.checkins.get(S.date) || {}), date: S.date };
    c[b.dataset.k] = c[b.dataset.k] === +v ? null : +v;
    saveCheckin(S.date, c); rerenderKeepScroll(); return;
  }
  if (act === 'newSession') {
    const id = `${S.date}-${uidGen()}`;
    S.sessions.set(id, { id, date: S.date, title: 'New session', focus: 'MOD', phase: '', week: '', status: 'planned', notes: null, groups: [{ name: 'FORCE', items: [] }], sessionRpe: null, minutes: null, comment: null, order: 9 });
    touch(id); S.open = id; S.edit = true; render(); window.scrollTo(0, 0); return;
  }
  if (act === 'restSkip') { stopRest(); return; }
  if (act === 'restAdd') { T.end += Number(v) * 1000; T.total = Math.max(T.total, Math.ceil((T.end - Date.now()) / 1000)); drawTimer(); return; }
  if (act === 'pick') { const el = $({ plan: '#filePlan', lumin: '#fileLumin', restore: '#fileRestore' }[v]); if (el) { el.value = ''; el.click(); } return; }
  if (act === 'backup') { backup(); return; }
  if (act === 'export') { exportCsv(v === 'all'); return; }
  if (act === 'wipe') {
    if (b.dataset.confirm !== '1') { b.dataset.confirm = '1'; b.textContent = 'Tap again to delete everything'; setTimeout(() => { if (b.isConnected) { b.dataset.confirm = ''; b.textContent = 'Delete all data on this phone'; } }, 4000); return; }
    await idb.write(['sessions', 'checkins', 'history', 'meta'], os => ['sessions', 'checkins', 'history', 'meta'].forEach(n => os(n).clear()));
    S.sessions.clear(); S.checkins.clear(); S.lumin = []; S.meta = {}; buildIndex(); render(); toast('All data deleted'); return;
  }
  const sid = S.open; if (!sid) return;
  if (act === 'tick') {
    const { id, s, gi, ii, si } = ref(k); if (!s) return;
    const it = s.groups[gi].items[ii], st = it.sets[si], p = st.plan || {};
    const d = st.done ? { ...st.done } : {};
    if (!d.ok) {
      const lt = lastTime(it.name, s.date, s.id), prev = lt && lt.sets.length ? (lt.sets[si] || lt.sets.at(-1)) : null;
      if (it.kind === 'load' && d.kg == null) d.kg = p.kg ?? (prev && prev.kg ? prev.kg : null);
      if (it.kind === 'time' && d.kg == null && p.kg == null && prev && prev.kg) d.kg = prev.kg;
      if ((it.kind === 'load' || it.kind === 'bw') && d.reps == null) d.reps = repsNum(p.r);
      if (it.kind === 'time') { if (d.sec == null) d.sec = p.sec ?? null; if (d.kg == null && p.kg != null) d.kg = p.kg; }
      d.ok = true;
      if (s.status === 'planned') s.status = 'in_progress';
      if (it.rest > 0) {
        const g = s.groups[gi], nxt = nextInChain(g, ii);
        const chain = chainsFor(g).get(ii);
        let label;
        if (nxt != null) label = `Next: ${g.items[nxt].name}`;
        else if (chain && chain.members.length > 1) label = `Next: ${g.items[chain.members[0]].name}, set ${Math.min(si + 2, g.items[chain.members[0]].sets.length)}`;
        else label = si + 1 < it.sets.length ? `Next: ${it.name}, set ${si + 2}` : 'Next exercise';
        startRest(it.rest, label);
      }
    } else d.ok = false;
    st.done = d; touch(id); buildIndex(); rerenderKeepScroll(); return;
  }
  if (act === 'addSet') {
    const { id, s, gi, ii } = ref(k); if (!s) return;
    const it = s.groups[gi].items[ii]; const lastSet = it.sets.at(-1);
    it.sets.push({ plan: lastSet ? clone(lastSet.plan) : (it.kind === 'run' || it.kind === 'check' ? { t: '' } : { r: 8 }), done: null });
    touch(id); rerenderKeepScroll(); return;
  }
  if (act === 'rmSet') { const { id, s, gi, ii, si } = ref(k); s.groups[gi].items[ii].sets.splice(si, 1); touch(id); rerenderKeepScroll(); return; }
  if (act === 'rmEx') { const { id, s, gi, ii } = ref(k); s.groups[gi].items.splice(ii, 1); touch(id); rerenderKeepScroll(); return; }
  if (act === 'mvEx') {
    const { id, s, gi, ii } = ref(k); const arr = s.groups[gi].items, j = ii + Number(b.dataset.d);
    if (j < 0 || j >= arr.length) return; [arr[ii], arr[j]] = [arr[j], arr[ii]]; touch(id); rerenderKeepScroll(); return;
  }
  if (act === 'addEx') {
    const { id, s, gi } = ref(k);
    s.groups[gi].items.push({ id: uidGen(), name: '', kind: 'load', note: null, sets: [1, 2, 3].map(() => ({ plan: { r: 8, kg: null }, done: null })) });
    touch(id); rerenderKeepScroll();
    const ins = document.querySelectorAll('[data-ef="name"]'); const last = ins[ins.length - 1]; if (last) last.focus();
    return;
  }
  const s = getSession(sid); if (!s || s.readOnly) return;
  if (act === 'addGrp') { s.groups.push({ name: 'NEW BLOCK', items: [] }); touch(sid); rerenderKeepScroll(); return; }
  if (act === 'rmGrp') { const { gi } = ref(k); s.groups.splice(gi, 1); touch(sid); rerenderKeepScroll(); return; }
  if (act === 'srpe') { s.sessionRpe = s.sessionRpe === +v ? null : +v; touch(sid); rerenderKeepScroll(); return; }
  if (act === 'status') { s.status = v; touch(sid); rerenderKeepScroll(); toast(v === 'completed' ? 'Session finished' : v === 'skipped' ? 'Marked as skipped' : 'Reopened'); return; }
  if (act === 'dup') {
    const to = $('#dupDate').value; if (!to) return;
    const id = `${to}-${uidGen()}`; const c = clone(s);
    Object.assign(c, { id, date: to, status: 'planned', sessionRpe: null, minutes: null, comment: null });
    for (const g of c.groups) for (const it of g.items) { it.id = uidGen(); it.comment = null; for (const st of it.sets) st.done = null; }
    S.sessions.set(id, c); touch(id); toast(`Copied to ${shortDate(to)}`); return;
  }
  if (act === 'del') {
    if (b.dataset.confirm !== '1') { b.dataset.confirm = '1'; b.textContent = 'Tap again to delete'; setTimeout(() => { if (b.isConnected) { b.dataset.confirm = ''; b.textContent = 'Delete session'; } }, 3000); return; }
    S.sessions.delete(sid); clearTimeout(timers.get(sid)); timers.delete(sid); save(sid); buildIndex(); S.open = null; S.edit = false; render(); toast('Session deleted'); return;
  }
});

document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'progEx') { if (IDX.has(t.value)) { S.progEx = t.value; pref.set('progEx', t.value); render(); const el = $('#progEx'); el.focus(); el.setSelectionRange(el.value.length, el.value.length); } return; }
  const sid = S.open; if (!sid) return;
  if (t.dataset.f) {
    const { id, s, gi, ii, si } = ref(t.dataset.k); if (!s) return;
    const st = s.groups[gi].items[ii].sets[si]; st.done = { ...(st.done || {}) };
    st.done[t.dataset.f] = t.dataset.f === 'note' ? t.value : numOrNull(t.value);
    touch(id); return;
  }
  if (t.dataset.cf) { const { id, s, gi, ii } = ref(t.dataset.k); if (!s) return; s.groups[gi].items[ii].comment = t.value || null; touch(id); return; }
  if (t.dataset.pf) {
    const { id, s, gi, ii, si } = ref(t.dataset.k); if (!s) return; const p = s.groups[gi].items[ii].sets[si].plan ||= {};
    const f = t.dataset.pf; p[f] = f === 't' ? t.value : f === 'r' ? (t.value === '' ? null : (/^\d+$/.test(t.value) ? +t.value : t.value)) : numOrNull(t.value);
    touch(id); return;
  }
  if (t.dataset.ef && t.tagName === 'INPUT') { const { id, s, gi, ii } = ref(t.dataset.k); if (!s) return; const f = t.dataset.ef; s.groups[gi].items[ii][f] = f === 'rest' ? numOrNull(t.value) : (t.value || (f === 'name' ? '' : null)); touch(id); return; }
  if (t.dataset.gf) { const { id, s, gi } = ref(t.dataset.k); if (!s) return; s.groups[gi].name = t.value; touch(id); return; }
  if (t.dataset.sf && t.dataset.sf !== 'date' && t.tagName !== 'SELECT') {
    const s = getSession(sid); if (!s || s.readOnly) return;
    const f = t.dataset.sf; s[f] = f === 'minutes' ? numOrNull(t.value) : f === 'title' ? t.value : (t.value || null);
    touch(sid); return;
  }
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.classList.contains('file-in')) {
    const f = t.files && t.files[0]; if (!f) return;
    try {
      const text = await f.text(); let msg;
      if (t.id === 'fileLumin') msg = await importLuminCSV(text);
      else { let obj; try { obj = JSON.parse(text); } catch { throw new Error('That file is not valid JSON.'); } msg = t.id === 'filePlan' ? await importPlan(obj) : await restore(obj); }
      buildIndex(); askPersist(); render(); toast(msg);
    } catch (err) { toast(err && err.message ? err.message : 'Import failed.'); }
    return;
  }
  const sid = S.open; if (!sid) return;
  const s = getSession(sid); if (!s || s.readOnly) return;
  if (t.dataset.ef === 'kind') { const { gi, ii } = ref(t.dataset.k); const it = s.groups[gi].items[ii]; it.kind = t.value; if (t.value === 'run' || t.value === 'check') it.sets.forEach(st => { st.plan = { t: st.plan?.t || '' }; }); touch(sid); rerenderKeepScroll(); return; }
  if (t.dataset.sf === 'focus') { s.focus = t.value; touch(sid); return; }
  if (t.dataset.sf === 'date' && t.value) { s.date = t.value; S.date = t.value; touch(sid); renderWeek(); return; }
});

// ---------- rest timer ----------
const T = { end: 0, total: 0, label: '', iv: null, ctx: null, doneAt: 0 };
function beep() {
  try {
    T.ctx = T.ctx || new (window.AudioContext || window.webkitAudioContext)();
    const o = T.ctx.createOscillator(), g = T.ctx.createGain();
    o.frequency.value = 880; g.gain.setValueAtTime(0.0001, T.ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.25, T.ctx.currentTime + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, T.ctx.currentTime + 0.5);
    o.connect(g); g.connect(T.ctx.destination); o.start(); o.stop(T.ctx.currentTime + 0.55);
  } catch {}
}
function startRest(sec, label) {
  try { T.ctx = T.ctx || new (window.AudioContext || window.webkitAudioContext)(); if (T.ctx.state === 'suspended') T.ctx.resume(); } catch {}
  T.total = sec; T.end = Date.now() + sec * 1000; T.label = label; T.doneAt = 0;
  clearInterval(T.iv); T.iv = setInterval(drawTimer, 250); drawTimer();
}
function stopRest() { clearInterval(T.iv); T.iv = null; $('#timer').hidden = true; document.body.classList.remove('timing'); }
function drawTimer() {
  const el = $('#timer'), left = Math.ceil((T.end - Date.now()) / 1000);
  el.hidden = false; document.body.classList.add('timing');
  if (left <= 0) {
    if (!T.doneAt) { T.doneAt = Date.now(); beep(); try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch {} }
    if (Date.now() - T.doneAt > 4000) { stopRest(); return; }
    el.className = 'timer done';
    el.innerHTML = `<div class="wrap"><span class="t">Go</span><span class="lbl"><b>Rest done</b>${esc(T.label)}</span><button data-act="restSkip">Close</button></div>`;
    return;
  }
  el.className = 'timer';
  el.innerHTML = `<div class="bar" style="transform:scaleX(${Math.max(0, left / T.total)})"></div><div class="wrap"><span class="t" role="timer" aria-live="off">${fmtRest(left)}</span><span class="lbl"><b>Rest</b>${esc(T.label)}</span><button data-act="restAdd" data-v="15" aria-label="15 seconds more">+15</button><button data-act="restSkip">Skip</button></div>`;
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && T.iv) drawTimer(); });

// ---------- boot ----------
async function askPersist() {
  try { if (navigator.storage && navigator.storage.persist) { S.persisted = await navigator.storage.persisted(); if (!S.persisted) S.persisted = await navigator.storage.persist(); } } catch {}
}
async function loadAll() {
  const [sessions, checkins, history, meta] = await Promise.all(['sessions', 'checkins', 'history', 'meta'].map(n => idb.all(n)));
  S.sessions = new Map(sessions.map(s => [s.id, s]));
  S.checkins = new Map(checkins.map(c => [c.date, c]));
  S.lumin = luminToSessions(history);
  S.meta = Object.fromEntries(meta.map(m => [m.k, m.v]));
  buildIndex();
}
async function boot() {
  render();
  try { await idb.open(); await loadAll(); }
  catch { S.storeError = true; }
  S.ready = true;
  if (!S.storeError && !S.sessions.size && !S.lumin.length) S.view = 'data';
  try { S.persisted = navigator.storage && navigator.storage.persisted ? await navigator.storage.persisted() : null; } catch {}
  if (S.sessions.size && !S.persisted && standalone()) askPersist();
  render();
  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
}
boot();
})();
